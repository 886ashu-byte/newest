    <script>
      // Browser Extension & Environment Compatibility Shield
      // Fixes Chrome extensions attempting to monkeypatch window.fetch when it has only a getter
      (function() {
        try {
          var originalFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : null;
          var currentFetch = originalFetch;

          var descriptor = {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          };

          try {
            Object.defineProperty(window, 'fetch', descriptor);
          } catch (_) {}

          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              Object.defineProperty(Window.prototype, 'fetch', descriptor);
            }
          } catch (_) {}
        } catch (e) {}

        // Suppress external browser extension unhandled exceptions from crashing AI Studio runtime
        window.addEventListener('error', function(event) {
          if (event && event.filename && (
            event.filename.indexOf('chrome-extension://') !== -1 ||
            event.filename.indexOf('moz-extension://') !== -1
          )) {
            if (typeof event.preventDefault === 'function') event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>

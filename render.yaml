services:
  - type: web
    name: smm-algorithmic-engine
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RELIABLESMM_API_KEY
        value: 79bb502d1dc2c1bccf81ef56a6ec9ef5
      - key: JAP_API_KEY
        value: 085945504bab9706597c00aaf8c1edb4
      - key: GEMINI_API_KEY
        sync: false
